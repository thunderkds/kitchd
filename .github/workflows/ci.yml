name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify-build:
    name: verify clean pnpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Verify clean install/build
        run: scripts/verify-build.sh

  web:
    name: web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependency (packages/shared)
        run: pnpm --filter @kitchenos/shared run build
      - name: Lint
        run: pnpm --filter @kitchenos/web run lint
      - name: Test
        run: pnpm --filter @kitchenos/web run test
      - name: Build (includes typecheck via tsc -b)
        run: pnpm --filter @kitchenos/web run build

  api:
    name: api (lint, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchenos
          POSTGRES_PASSWORD: kitchenos
          POSTGRES_DB: kitchenos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchenos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://kitchenos:kitchenos@localhost:5432/kitchenos?schema=public"
      JWT_SECRET: "ci-test-secret"
      JWT_EXPIRES_IN: "1d"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @kitchenos/api run prisma:generate
      - name: Prisma migrate deploy (against ephemeral CI DB)
        run: pnpm --filter @kitchenos/api run migrate
      - name: Lint
        run: pnpm --filter @kitchenos/api run lint
      - name: Test
        run: pnpm --filter @kitchenos/api run test
      - name: Build
        run: pnpm --filter @kitchenos/api run build
